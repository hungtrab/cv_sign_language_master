[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "asl-pipeline"
version = "0.1.0"
description = "Modular ASL A-Z recognition: comparing visual representations"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<2.0",
    "opencv-python>=4.8.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "mediapipe>=0.10.14",
    "scikit-learn>=1.3.0",
    "huggingface-hub>=0.20.0",
    "transformers>=4.36.0",
    "Pillow>=10.0.0",
    "PyYAML>=6.0",
    "tqdm>=4.60.0",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1.0"]
yolo = ["ultralytics>=8.0.0"]

[tool.setuptools.packages.find]
where = ["src"]
