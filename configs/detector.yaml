# YOLOv8 hand detector training config.
# Consumed by scripts/train_detector.py via Ultralytics' API.

experiment_name: yolov8_hand
seed: 11711

paths:
  data_yaml: data/yolo/dataset.yaml         # generated by prepare_yolo_data
  output_dir: runs/detector

model:
  weights: yolov8n.pt                        # pretrained nano (fast, CPU-friendly)
  num_classes: 1                             # only "hand"
  image_size: 640

training:
  epochs: 50
  batch_size: 16
  device: 0                                  # cuda device id; "cpu" also works
  patience: 10
  optimizer: SGD
  lr0: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  workers: 4
  amp: true
